name: Webhook test
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - run: sleep 70
  flaky:
    runs-on: ubuntu-latest
    steps:
      - run: echo "first step passes"
      - run: exit 1
      - run: echo "never reached"
  never:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"
